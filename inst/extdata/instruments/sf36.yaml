source_ref: 'RAND 36-Item Health Survey 1.0 (Hays RD, Sherbourne CD, Mazel RM (1993) Health Econ 2:217-227; RAND Corporation, public domain). Each item is recoded to 0-100 and averaged within its scale, giving eight subscale scores (0-100, higher = better health). The health-transition item is not part of the eight scales. Norm-based T-scores and the PCS/MCS component summaries use proprietary US population weights and are out of scope.'
